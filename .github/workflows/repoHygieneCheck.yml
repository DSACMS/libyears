name: Repository Hygiene Check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repolinter-checks:
    name: Tier 2 Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Tier 2 repolinter checks
        run: npx --yes repolinter@0.12.0 lint .
