name: Check for Secrets
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan-for-secrets:
    name: Run gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - name: Check for GitLeaks
        uses: gacts/gitleaks@v1
        with:
          config-path: .github/.gitleaks.toml
